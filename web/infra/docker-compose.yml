services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: parkdrone
      POSTGRES_PASSWORD: parkdrone
      POSTGRES_DB: parkdrone
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkdrone"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Creates the frames bucket on startup so the server can assume it exists,
  # and sets a 1-day expiry lifecycle rule: frames are transient scoring input, so
  # only the latest run per world is retained (keys overwrite in place) and any
  # stale tail / abandoned-world frames age out within a day. `ilm rule add` is
  # idempotent enough here — a duplicate rule on restart is harmless.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 minioadmin minioadmin) do sleep 1; done;
      mc mb -p local/parkdrone-frames;
      mc ilm rule ls local/parkdrone-frames >/dev/null 2>&1 || mc ilm rule add local/parkdrone-frames --expire-days 1;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
